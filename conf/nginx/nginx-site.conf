server {
  listen 80;
  server_name _;
  root /var/www/html/public;
  index index.html index.htm index.php;
  sendfile off;
  error_log /dev/stdout info;
  access_log /dev/stdout;

  location /.git {
    deny all;
    return 403;
  }

  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-XSS-Protection "1; mode=block";
  add_header X-Content-Type-Options "nosniff";
  charset utf-8;

  # Compress pages, styles and scripts before sending (pages are ~100-200 KB of HTML;
  # gzip makes them roughly 5x smaller, so they arrive much faster on mobile data).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css text/plain text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location = /favicon.ico { access_log off; log_not_found off; }
  location = /robots.txt { access_log off; log_not_found off; }
  error_page 404 /index.php;

  location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|tiff|ttf|svg|woff2)$ {
    expires 5d;
  }

  location ~ \.php$ {
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass unix:/var/run/php-fpm.sock;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param SCRIPT_NAME $fastcgi_script_name;
    include fastcgi_params;
    # The AI timetable capture now makes several Groq calls one at a time
    # instead of all at once (a rate-limit fix — see ClassScheduleController),
    # so that one request can legitimately take longer than nginx's 60s
    # default before php-fpm responds. Without this, nginx would cut the
    # connection on a slow-but-still-working capture and the user would see
    # a blank/hung page instead of the real result.
    fastcgi_read_timeout 240s;
  }

  location ~ /\. {
    log_not_found off;
    deny all;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}